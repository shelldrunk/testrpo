name: Crypto public spot market bridge (public data, no trading)
on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/refresh_request.txt'
permissions:
  contents: write
concurrency:
  group: crypto-public-market-bridge
  cancel-in-progress: false
jobs:
  market-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser and safety tests
        run: python -m unittest discover -s tests -v
      - name: Fetch public spot quotes and completed 1H/4H OHLC
        run: python scripts/market_probe.py --output market_probe.json --fast-fallback
      - name: Render Traditional Chinese research summary
        if: always()
        run: python scripts/render_watch_summary.py market_probe.json > watch_research_summary.txt
      - name: Publish public market snapshot for Watch readback
        if: always()
        run: |
          if [ ! -s market_probe.json ]; then
            echo "Market probe did not produce evidence; no publication"
            exit 1
          fi
          python scripts/compact_watch_feed.py market_probe.json watch_market_compact.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=0
          for attempt in 1 2 3 4; do
            # Concurrent Watch requests can advance main after workflow checkout.
            # Reset the job checkout to remote main BEFORE copying the immutable
            # market_probe.json generated by THIS run. Never force push.
            git fetch origin main
            git reset --hard origin/main
            mkdir -p bridge
            cp watch_market_compact.json bridge/latest_market.json
            git add bridge/latest_market.json
            if git diff --cached --quiet; then
              echo 'Snapshot already present'; published=1; break
            fi
            git commit -m 'Publish timestamped public crypto market snapshot [skip ci]'
            if git push origin HEAD:main; then
              published=1; break
            fi
            echo "Concurrent commit detected; retrying publication ($attempt/4)"
            sleep 1
          done
          if [ "$published" -ne 1 ]; then
            echo 'Failed to publish GitHub public market snapshot after retries'
            exit 1
          fi
      - name: Archive raw market evidence, including failed providers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-public-market-evidence
          path: |
            market_probe.json
            watch_research_summary.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Gate actual market evidence
        run: |
          python scripts/verify_probe.py market_probe.json
          python scripts/validate_watch_snapshot.py market_probe.json